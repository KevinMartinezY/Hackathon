<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar Sesión | Sportcommerce</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Oswald:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/base.css">
</head>
<body class="d-flex align-items-center justify-content-center min-vh-100" style="background: radial-gradient(circle at top right, rgba(225, 29, 72, 0.15) 0%, #0b0f19 70%);">

  <div class="container">
    <div class="row justify-content-center">
      <div class="col-12 col-sm-10 col-md-7 col-lg-5">
        <div class="card bg-dark border-secondary p-4 p-md-5 shadow-lg rounded-4">
          
          <div class="text-center mb-4">
            <a href="index.html" class="logo d-inline-block mb-2" style="font-size: 2rem;">
              <span class="highlight-red">SPORT</span>COMMERCE
            </a>
            <p class="text-muted small mb-0">Accede a tu cuenta de atleta para gestionar tus pedidos</p>
          </div>

          <div id="loginAlert"></div>

          <form id="loginForm" novalidate>
            <div class="mb-3">
              <label for="loginEmail" class="form-label text-light small fw-semibold">Correo Electrónico</label>
              <div class="input-group">
                <span class="input-group-text bg-black border-secondary text-secondary"><i class="fa-regular fa-envelope"></i></span>
                <input type="email" class="form-control bg-black text-light border-secondary" id="loginEmail" placeholder="atleta@sportcommerce.com" required>
              </div>
            </div>

            <div class="mb-4">
              <label for="loginPass" class="form-label text-light small fw-semibold">Contraseña</label>
              <div class="input-group">
                <span class="input-group-text bg-black border-secondary text-secondary"><i class="fa-solid fa-lock"></i></span>
                <input type="password" class="form-control bg-black text-light border-secondary" id="loginPass" placeholder="••••••••" required minlength="6">
              </div>
            </div>

            <button type="submit" class="btn-gym btn-primary w-100 mb-3">
              INGRESAR <i class="fa-solid fa-right-to-bracket"></i>
            </button>

            <div class="text-center mt-3">
              <a href="index.html" class="text-muted small"><i class="fa-solid fa-arrow-left me-1"></i> Volver a la tienda</a>
            </div>
          </form>

        </div>
      </div>
    </div>
  </div>

  <script>
    document.getElementById('loginForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const email = document.getElementById('loginEmail').value.trim();
      const pass = document.getElementById('loginPass').value.trim();
      const alertBox = document.getElementById('loginAlert');

      if (!email.includes('@') || pass.length < 4) {
        alertBox.innerHTML = '<div class="alert alert-danger py-2 small">Ingresa un correo válido y una contraseña de al menos 4 caracteres.</div>';
        return;
      }

      alertBox.innerHTML = '<div class="alert alert-success py-2 small">¡Bienvenido de vuelta! Redirigiendo a la tienda...</div>';
      setTimeout(() => { window.location.href = 'index.html'; }, 1200);
    });
  </script>
</body>
</html>
